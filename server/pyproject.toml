[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex-rpg-wiki"
version = "0.1.0"
description = "Zephyrex RPG Wiki: entities, lore, secrets, timelines, maps, history"
requires-python = ">=3.11"
dependencies = [
    # rpg_state widens the framework's genealogy extension.
    "zephyrex[genealogy]",
    # zephyrex passes FastAPI(openapi_version=...), which FastAPI 0.162 rejects;
    # hold the version the framework's own requirements.lock vets.
    "fastapi~=0.142.2",
]

# The extensions (loaded from ./extensions) and the two importers, named: with more than one top-level
# package, setuptools' automatic discovery refuses to build.
[tool.setuptools.packages.find]
include = ["extensions*", "vault_import*", "st_import*", "compendium_import*"]

# The framework from the checkout deploy/fetch-frameworks.sh lays out beside this repository
# (Source/server-framework on the desktop), at the commit deploy/frameworks.env pins, as the
# other Zephyrex apps use it; back to the PyPI release once one ships what they need.
[tool.uv.sources]
zephyrex = { path = "../../server-framework", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]
